<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2D3E50">
    <title>Japan Trip 2025 - Interactive Itinerary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600;700&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Security Password Overlay -->
    <div id="securityOverlay" class="security-overlay">
        <div class="password-container">
            <div class="lock-icon">🔒</div>
            <h2>Secure Access</h2>
            <p>Enter 6-digit password to continue</p>
            <input
                type="password"
                id="passwordInput"
                class="password-input"
                maxlength="6"
                placeholder="••••••"
                autocomplete="off"
            />
            <button id="unlockBtn" class="unlock-btn">Unlock</button>
            <div id="errorMessage" class="error-message"></div>
        </div>
    </div>

    <div class="app-header">
        <div class="header-content">
            <h1>🇯🇵 Japan Journey 2025</h1>
            <p style="font-size: 1.1em; opacity: 0.9;">Tokyo → Hakone → Mt. Fuji</p>
            <div class="countdown">
                <div class="countdown-label">Adventure begins in:</div>
                <div class="countdown-timer" id="countdown">Calculating...</div>
            </div>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="nav-tab active" onclick="showSection('overview')">Overview</button>
        <button class="nav-tab" onclick="showSection('itinerary')">Daily Plan</button>
        <button class="nav-tab" onclick="showSection('flights')">Flights</button>
        <button class="nav-tab" onclick="showSection('hotels')">Hotels</button>
        <button class="nav-tab" onclick="showSection('dining')">Dining</button>
        <button class="nav-tab" onclick="showSection('expenses')">Budget</button>
        <button class="nav-tab" onclick="showSection('contacts')">Info</button>
    </div>

    <!-- Content sections - loaded dynamically -->
    <div id="overview" class="content-section active"></div>
    <div id="itinerary" class="content-section"></div>
    <div id="flights" class="content-section"></div>
    <div id="hotels" class="content-section"></div>
    <div id="dining" class="content-section"></div>
    <div id="expenses" class="content-section"></div>
    <div id="contacts" class="content-section"></div>

    <div class="floating-action" onclick="quickActions()">
        📱
    </div>

    <script src="script.js"></script>
</body>
</html>
